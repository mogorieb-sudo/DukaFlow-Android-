name: Build DukaFlow APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode and verify keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/dukaflow-release.jks"
          sha256sum "$GITHUB_WORKSPACE/dukaflow-release.jks"
          echo "Keystore size:"
          wc -c "$GITHUB_WORKSPACE/dukaflow-release.jks"

          echo "Keystore type:"
          file "$GITHUB_WORKSPACE/dukaflow-release.jks"

          echo "Testing keystore:"
          keytool -list \
            -keystore "$GITHUB_WORKSPACE/dukaflow-release.jks" \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.KEY_ALIAS }}"
      - name: Build unsigned release APK
        run: gradle assembleRelease

      - name: Zipalign APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -v -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/release/dukaflow-aligned.apk

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$GITHUB_WORKSPACE/dukaflow-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out app/build/outputs/apk/release/DukaFlow.apk \
            app/build/outputs/apk/release/dukaflow-aligned.apk

      - name: Verify signed APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose \
            app/build/outputs/apk/release/DukaFlow.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: DukaFlow-release-APK
          path: app/build/outputs/apk/release/DukaFlow.apk
